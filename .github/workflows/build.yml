name: Build check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '*.mdx'
      - '**/*.mdx'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '*.mdx'
      - '**/*.mdx'

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'docs/phase-1-secure-foundation-spec'
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser navigation tests
        run: npm run test:e2e
