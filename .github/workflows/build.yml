name: Build check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Local Supabase security, TypeScript and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start isolated local Supabase services
        run: npx supabase start --exclude studio,mail,analytics,realtime,functions

      - name: Write ignored local-only environment files
        run: node scripts/write-local-supabase-env.mjs

      - name: Reset local database and load synthetic fixtures
        run: npx supabase db reset --local

      - name: Run PostgreSQL Row Level Security tests
        run: npx supabase test db --local

      - name: Build and type-check browser and Worker
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser navigation, account and API tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true

  preview:
    name: Deploy public Preview after all checks pass
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'gradioprep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the exact pull request revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview assets
        run: npm run build

      - name: Check whether Cloudflare preview credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update this pull request's Cloudflare Preview
        id: preview
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ format('pr-{0}', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          preview_json="$(printf '%s\n' "$output" | awk 'BEGIN { capture = 0 } /^[[:space:]]*[{]/ { capture = 1 } capture { print }')"
          preview_url="$(printf '%s\n' "$preview_json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Public Cloudflare Worker Preview ready"
            echo ""
            echo "Preview URL: $preview_url"
            echo ""
            echo "This is an unreleased, synthetic-data-only verification preview. It is publicly reachable unless Cloudflare Access is separately configured. Do not enter personal or learner data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request with its Preview URL
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-controlled-preview -->';
            const body = `${marker}
            ### Public Cloudflare Preview ready

            **Preview URL:** ${process.env.PREVIEW_URL}

            This is an unreleased, synthetic-data-only verification preview. It is public unless Cloudflare Access is enabled. Do not enter personal or real learner data.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Record why the hosted preview was not deployed
        if: steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "### Hosted preview not deployed"
            echo ""
            echo "The full Build check passed, but Cloudflare preview credentials are not configured as repository Actions secrets."
            echo ""
            echo "The repository owner must add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Use an account-restricted Workers token with preview upload permissions only; do not grant DNS/zone or production deployment permissions."
          } >> "$GITHUB_STEP_SUMMARY"
