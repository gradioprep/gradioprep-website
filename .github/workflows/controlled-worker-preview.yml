name: Controlled Cloudflare Worker preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build and deploy isolated preview only
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'preview/cambridge-stage-7-unit-1-accessibility') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/preview/cambridge-stage-7-unit-1-accessibility')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the approved preview branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview assets
        run: npm run build

      - name: Check whether Cloudflare preview credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy isolated Cloudflare Worker Preview
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name cambridge-stage-7-unit-1-accessibility

      - name: Record when credentials are missing
        if: steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "### Hosted preview not deployed"
            echo ""
            echo "The application build passed, but the Cloudflare deployment credentials are not configured as repository Actions secrets."
            echo ""
            echo "To enable the isolated preview, add repository secrets named `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`. The token should have only the Cloudflare permissions needed to upload Worker previews. This workflow is restricted to the approved preview branch and uses `wrangler preview`, not `wrangler deploy`."
          } >> "$GITHUB_STEP_SUMMARY"
