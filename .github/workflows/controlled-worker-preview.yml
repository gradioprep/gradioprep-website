name: Controlled Cloudflare Worker preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Build branch previews for both ordinary PRs to main and the active
    # stacked documentation/implementation train. These are BASE branches.
    branches:
      - main
      - feature/pdf-submission-grading-timers-plan

permissions:
  contents: read

jobs:
  preview:
    name: Build and deploy controlled preview only
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'gradioprep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact pull request revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview assets
        run: npm run build

      - name: Check whether Cloudflare preview credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update this pull request's Cloudflare Preview
        id: preview
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ format('pr-{0}', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          preview_json="$(printf '%s\n' "$output" | awk 'BEGIN { capture = 0 } /^[[:space:]]*[{]/ { capture = 1 } capture { print }')"
          preview_url="$(printf '%s\n' "$preview_json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Public Cloudflare Worker Preview ready"
            echo ""
            echo "Preview URL: $preview_url"
            echo ""
            echo "This is an unreleased, synthetic-data-only verification preview. It is publicly reachable unless Cloudflare Access is separately configured. Do not enter personal or learner data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request with its Preview URL
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-controlled-preview -->';
            const body = `${marker}
            ### Public Cloudflare Preview ready

            **Preview URL:** ${process.env.PREVIEW_URL}

            This is an unreleased, synthetic-data-only verification preview. It is public unless Cloudflare Access is enabled. Do not enter personal or real learner data.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Record why the hosted preview was not deployed
        if: steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "### Hosted preview not deployed"
            echo ""
            echo "The application build passed, but Cloudflare preview credentials are not configured as repository Actions secrets."
            echo ""
            echo "The repository owner must add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Use an account-restricted Workers token with preview upload permissions only; do not grant DNS/zone or production deployment permissions."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove this Preview when its pull request closes
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'gradioprep'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository configuration
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Delete the Preview if credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ format('pr-{0}', github.event.pull_request.number) }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
          else
            echo "Preview cleanup skipped because Cloudflare credentials are not configured."
          fi
