name: Controlled Cloudflare Worker preview cleanup

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - feature/pdf-submission-grading-timers-plan
      - docs/phase-1-secure-foundation-spec

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove this PR's public Preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'gradioprep'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository configuration
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Delete the Preview if credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ format('pr-{0}', github.event.pull_request.number) }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
          else
            echo "Preview cleanup skipped because Cloudflare credentials are not configured."
          fi
