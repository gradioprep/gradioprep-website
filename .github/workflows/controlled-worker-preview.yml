name: Controlled Cloudflare Worker preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

# Keep write access limited to the job that reports a preview URL to its PR.
permissions:
  contents: read

jobs:
  preview:
    name: Build and deploy controlled preview only
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/preview/cambridge-stage-7-unit-1-accessibility' ||
        github.ref == 'refs/heads/preview/cbse-grade-6-unit-1-accessibility'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the approved preview branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview assets
        run: npm run build

      - name: Check whether Cloudflare preview credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the Cloudflare Preview
        id: preview
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/preview/cbse-grade-6-unit-1-accessibility' && 'pr-17' || 'pr-15') }}
        run: |
          set -euo pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          # Wrangler prints progress messages before the JSON response. Extract the JSON object first.
          preview_json="$(printf '%s\n' "$output" | awk 'BEGIN { capture = 0 } /^[[:space:]]*[{]/ { capture = 1 } capture { print }')"
          preview_url="$(printf '%s\n' "$preview_json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare Preview deployment succeeded"
            echo ""
            echo "Preview URL: $preview_url"
            echo ""
            echo "This is an unreleased interface-testing preview. It is publicly reachable unless Cloudflare Access is separately configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request with the preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-controlled-preview -->';
            const body = `${marker}
            ### Controlled Cloudflare Preview ready

            **Preview URL:** ${process.env.PREVIEW_URL}

            This is an unreleased interface-testing preview only. The URL is public unless Cloudflare Access is separately configured. Do not use this for real student data or treat the unit as student-ready.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Record when credentials are missing
        if: steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "### Hosted preview not deployed"
            echo ""
            echo "The application build passed, but Cloudflare deployment credentials are not configured as repository Actions secrets."
            echo ""
            echo "Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable preview deployment. The token should be restricted to the Workers permissions needed for preview uploads. This workflow is restricted to the approved preview branch and uses npx wrangler preview, not npx wrangler deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove preview when the review PR closes
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved preview branch
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Delete the preview if credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
          else
            echo "Preview cleanup skipped because Cloudflare secrets are not configured."
          fi
