name: Phase 1B/1C local security and feature verification

on:
  push:
    branches:
      - feature/phase-1b-local-auth-api
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '*.mdx'
      - '**/*.mdx'

concurrency:
  group: phase1b-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-preview:
    name: Local Supabase security, build and browser tests
    if: github.actor == 'gradioprep'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # package-lock.json is intentionally not committed in this prototype.
      # Cache npm's verified package tarballs, not node_modules or build output.
      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      # Keep PostgreSQL, Auth, Kong, PostgREST, Storage and Mailpit. Exclude
      # optional dashboard/telemetry/runtime services to reduce cold image pulls.
      - name: Start isolated local Supabase services
        run: npx supabase start --exclude studio,logflare,vector,edge-runtime,postgres-meta,realtime,supavisor

      - name: Write ignored local-only environment files
        run: node scripts/write-local-supabase-env.mjs

      - name: Reset local database and load synthetic fixtures
        run: npx supabase db reset --local

      - name: Run PostgreSQL Row Level Security tests
        run: npx supabase test db --local

      - name: Type-check and build browser and Worker with local synthetic backend
        run: npm run build

      # Cache only Playwright's versioned browser binaries. OS libraries are
      # checked/installed on every fresh runner; database state is never cached.
      - name: Cache Playwright Chromium downloads
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run navigation, account and API browser tests
        run: npm run test:e2e

      - name: Verify local synthetic database and private-PDF backup/restore round trip
        run: npm run phase1e:backup:verify

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true

      # Never upload a public Worker Preview with local API endpoints or local
      # publishable keys embedded in its browser bundle or Worker vars.
      - name: Remove local-only environment files
        if: always()
        run: rm -f .dev.vars .env.local

      - name: Build clean public-preview assets without local credentials
        run: npm run build

      - name: Check whether Cloudflare preview credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update public Cloudflare Preview after all tests pass
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.body, '<!-- founder-preview-required -->') &&
          steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ format('pr-{0}', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          preview_json="$(printf '%s\n' "$output" | awk 'BEGIN { capture = 0 } /^[[:space:]]*[{]/ { capture = 1 } capture { print }')"
          preview_url="$(printf '%s\n' "$preview_json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Public Cloudflare Worker Preview ready"
            echo ""
            echo "Preview URL: $preview_url"
            echo ""
            echo "The complete local Auth/RLS, build and browser test pipeline passed before this Preview was uploaded."
            echo ""
            echo "This is an unreleased, synthetic-data-only verification Preview. It is public unless Cloudflare Access is separately configured. Do not enter personal or learner data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request with its verified Preview URL
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-controlled-preview -->';
            const body = `${marker}
            ### Public Cloudflare Preview ready

            **Preview URL:** ${process.env.PREVIEW_URL}

            **Verification order:** local Supabase/RLS tests → TypeScript/Worker/Vite build → Playwright → clean public Preview upload.

            This is an unreleased synthetic-data-only Preview. It is public unless Cloudflare Access is enabled. It is not connected to a hosted or production Supabase project. Do not enter personal or real learner data.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Record why the public Preview was not deployed
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.body, '<!-- founder-preview-required -->') &&
          steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "### Public Preview not deployed"
            echo ""
            echo "Local Supabase, RLS, build and browser tests completed, but Cloudflare preview credentials are not configured as repository Actions secrets."
            echo ""
            echo "The repository owner must add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Use a Workers preview-only account-restricted token; do not grant DNS/zone or production deployment permissions."
          } >> "$GITHUB_STEP_SUMMARY"
