name: Phase 1B/1C local security and feature verification

on:
  push:
    branches:
      - feature/phase-1b-local-auth-api
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '*.mdx'
      - '**/*.mdx'

concurrency:
  group: phase1b-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-preview:
    name: Local Supabase security, build and browser tests
    if: github.actor == 'gradioprep'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write  # Update the fixed PR #22 Preview handoff only
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # package-lock.json is intentionally not committed in this prototype.
      # Cache npm's verified package tarballs, not node_modules or build output.
      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      # Keep PostgreSQL, Auth, Kong, PostgREST, Storage and Mailpit. Exclude
      # optional dashboard/telemetry/runtime services to reduce cold image pulls.
      - name: Start isolated local Supabase services
        run: npx supabase start --exclude studio,logflare,vector,edge-runtime,postgres-meta,realtime,supavisor

      - name: Write ignored local-only environment files
        run: node scripts/write-local-supabase-env.mjs

      - name: Reset local database and load synthetic fixtures
        run: npx supabase db reset --local

      # Includes the PA scope regression: no Listening observations are enabled or writable in the PA.
      - name: Run PostgreSQL Row Level Security tests
        run: npx supabase test db --local

      - name: Type-check and build browser and Worker with local synthetic backend
        run: npm run build

      # Cache only Playwright's versioned browser binaries. OS libraries are
      # checked/installed on every fresh runner; database state is never cached.
      - name: Cache Playwright Chromium downloads
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Ensure Playwright Chromium system libraries
        shell: bash
        run: |
          set -euo pipefail
          required_libraries=(
            "libasound.so.2"
            "libatk-1.0.so.0"
            "libatk-bridge-2.0.so.0"
            "libatspi.so.0"
            "libcairo.so.2"
            "libcups.so.2"
            "libdbus-1.so.3"
            "libdrm.so.2"
            "libgbm.so.1"
            "libglib-2.0.so.0"
            "libnspr4.so"
            "libnss3.so"
            "libpango-1.0.so.0"
            "libX11.so.6"
            "libX11-xcb.so.1"
            "libxcb.so.1"
            "libXcomposite.so.1"
            "libXdamage.so.1"
            "libXext.so.6"
            "libXfixes.so.3"
            "libxkbcommon.so.0"
            "libXrandr.so.2"
            "libXrender.so.1"
            "libXtst.so.6"
            "libfontconfig.so.1"
            "libfreetype.so.6"
          )
          missing=()
          for library in "${required_libraries[@]}"; do
            if ! ldconfig -p | grep -Fq "$library"; then
              missing+=("$library")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Installing missing Chromium libraries: %s\\n' "${missing[*]}"
            npx playwright install-deps chromium
          else
            echo "GitHub-hosted Ubuntu already provides the Playwright Chromium system libraries."
          fi

      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run navigation, account and API browser tests
        run: npm run test:e2e

      - name: Verify local synthetic database and private-PDF backup/restore round trip
        run: npm run phase1e:backup:verify

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true

      # Push-triggered exact-head CI publishes only after all test steps pass.
      # Never upload a public Worker Preview with local API endpoints or local
      # publishable keys embedded in its browser bundle or Worker vars.
      - name: Remove local-only environment files
        if: always()
        run: rm -f .dev.vars .env.local

      - name: Require isolated Supabase Preview secrets
        env:
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for name in PREVIEW_SUPABASE_URL PREVIEW_SUPABASE_PUBLISHABLE_KEY PREVIEW_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Preview secret name: $name" >&2
              exit 1
            fi
          done

      - name: Build clean public-preview assets with publishable Supabase settings only
        env:
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Refuse to publish private service-role credentials in browser assets
        env:
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if grep -R -F -q -- "$PREVIEW_SUPABASE_SERVICE_ROLE_KEY" dist; then
            echo "Refusing Preview upload: privileged credential present in public assets." >&2
            exit 1
          fi

      - name: Reject local backend URLs in public Preview files
        run: |
          set -euo pipefail
          if grep -R -E -l '(127\\.0\\.0\\.1:5432[0-9]|localhost:5432[0-9])' dist; then
            echo "Refusing Preview upload: local Supabase URL is present in assets." >&2
            exit 1
          fi

      - name: Check whether Cloudflare preview credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update public Cloudflare Preview after all tests pass
        id: preview
        if: >-
          github.ref == 'refs/heads/feature/phase-1b-local-auth-api' &&
          github.actor == 'gradioprep' &&
          steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-22
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          preview_json="$(printf '%s\n' "$output" | awk 'BEGIN { capture = 0 } /^[[:space:]]*[{]/ { capture = 1 } capture { print }')"
          preview_url="$(printf '%s\n' "$preview_json" | jq -er '.preview.urls[0]')"
          # Bind privileged settings as encrypted Worker Preview secrets, not public Vite variables.
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          jq -n \
            --arg url "$PREVIEW_SUPABASE_URL" \
            --arg publishable "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" \
            --arg service "$PREVIEW_SUPABASE_SERVICE_ROLE_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $publishable, SUPABASE_SERVICE_ROLE_KEY: $service}' > "$secret_file"
          npx wrangler preview secret bulk "$secret_file" --name "$PREVIEW_NAME" >/dev/null
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Public Cloudflare Worker Preview ready"
            echo ""
            echo "Preview URL: $preview_url"
            echo "Application commit: $GITHUB_SHA"
            echo ""
            echo "The complete local Auth/RLS, build and browser test pipeline passed before this Preview was uploaded."
            echo ""
            echo "This is an unreleased, synthetic-data-only verification Preview. It is public unless Cloudflare Access is separately configured. Do not enter personal or learner data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request with its verified Preview URL
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-controlled-preview -->';
            const body = `${marker}
            ### Public Cloudflare Preview ready

            **Preview URL:** ${process.env.PREVIEW_URL}

            **Exact application commit:** ${context.sha}

            **Verification order:** local Supabase/RLS tests → TypeScript/Worker/Vite build → Playwright → clean public Preview upload.

            This is an unreleased synthetic-data-only Preview. It is public unless Cloudflare Access is enabled. It uses the isolated synthetic Preview Supabase project. Do not enter personal or real learner data.`;
            const { owner, repo } = context.repo;
            const issue_number = 22; // Dedicated trusted push branch for draft PR #22
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Record why the public Preview was not deployed
        if: >-
          github.ref == 'refs/heads/feature/phase-1b-local-auth-api' &&
          github.actor == 'gradioprep' &&
          steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "### Public Preview not deployed"
            echo ""
            echo "Local Supabase, RLS, build and browser tests completed, but Cloudflare preview credentials are not configured as repository Actions secrets."
            echo ""
            echo "The repository owner must add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Use a Workers preview-only account-restricted token; do not grant DNS/zone or production deployment permissions."
          } >> "$GITHUB_STEP_SUMMARY"
